[project]
name = "agent-autopsy-backend"
version = "0.1.0"
description = "API and execution services for Agent Autopsy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
