[project]
name = "agent-autopsy-backend"
version = "0.1.0"
description = "API and execution services for Agent Autopsy"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "openai>=3.35.1",
    "openinference-semantic-conventions>=0.1.41",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
observability = [
    "arize-phoenix>=20.23.0",
]
